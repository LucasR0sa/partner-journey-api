name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey
          POSTGRES_DB: journey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journey"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://journey:journey@localhost:5432/journey_test
      WEBHOOK_SECRET: segredo-de-ci-com-pelo-menos-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verificar formatação
        run: >-
          npm run format:check --
          .github/workflows/ci.yml
          README.md
          ROADMAP.md
          docker-compose.yml
          docs/adr/0003-sincronizacao-incremental.md
          package.json
          src/app.ts
          src/jobs/run-sync.ts
          src/modules/production/sync.job.ts
          src/modules/production/sync.repository.ts
          src/modules/signups/signup.repository.ts
          src/modules/signups/signup.routes.ts
          src/modules/signups/signup.service.ts
          tests/integration/production.sync.test.ts
          tests/integration/production.full-sync.test.ts
          tests/integration/production.migration.test.ts
          tests/integration/production.link-race.test.ts
          tests/integration/roadmap.todo.test.ts
          tests/integration/signups.webhook.test.ts
          tests/unit/match.test.ts
          tools/seed.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t partner-journey-api:${{ github.sha }} .
